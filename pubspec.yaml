funding:
  - https://www.buymeacoffee.com/dev_cetera
  - https://www.patreon.com/c/robelator
  - https://github.com/sponsors/robelator
description: "Render SMIL-animated SVGs in Flutter with programmatic pause / resume / speed control and per-colour replacement."
