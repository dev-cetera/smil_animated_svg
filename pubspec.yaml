dependencies:
  flutter:
    sdk: flutter

  xml: ^6.6.1
  path_drawing: ^1.0.1
  vector_math: ^2.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
