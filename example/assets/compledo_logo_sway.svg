<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Wind-sway animated compledo logo -->

  <!-- Pot (fixed) -->
  <path d="M168 340 h176 l-24 120 h-128 z" fill="#9E8E7E" />
  <rect x="152" y="320" width="208" height="28" rx="6" fill="#7A6A5A" />

  <!-- Lower stem segment — sways from base (256, 330) -->
  <g transform="translate(256, 330)">
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0; 4; -3; 5; -4; 2; -1; 0"
        keyTimes="0; 0.14; 0.28; 0.44; 0.58; 0.72; 0.86; 1"
        dur="1.6s"
        repeatCount="indefinite"
      />
      <g transform="translate(-256, -330)">

        <!-- Lower half of stem (extended up to hide joint) -->
        <rect x="244" y="256" width="24" height="74" rx="4" fill="#5C3A1E" />

        <!-- Upper segment — additional sway from mid-stem (256, 270) -->
        <g transform="translate(256, 270)">
          <g>
            <animateTransform
              attributeName="transform"
              type="rotate"
              values="0; 3; -2.5; 4; -3; 1.5; -1; 0"
              keyTimes="0; 0.14; 0.28; 0.44; 0.58; 0.72; 0.86; 1"
              dur="1.6s"
              repeatCount="indefinite"
            />
            <g transform="translate(-256, -270)">

              <!-- Upper half of stem (extended down to hide joint) -->
              <rect x="244" y="210" width="24" height="74" rx="4" fill="#5C3A1E" />

              <!-- Small branches -->
              <path d="M256 270 Q228 258 216 238" stroke="#5C3A1E" stroke-width="10" stroke-linecap="round" fill="none" />
              <path d="M256 248 Q282 234 294 218" stroke="#5C3A1E" stroke-width="8" stroke-linecap="round" fill="none" />

              <!-- Canopy — extra sway + squash-stretch from canopy centre -->
              <g transform="translate(256, 170)">
                <g>
                  <!-- Extra wobble on canopy (offset phase) -->
                  <animateTransform
                    attributeName="transform"
                    type="rotate"
                    values="0; -3; 4; -5; 3; -2; 1; 0"
                    keyTimes="0; 0.12; 0.26; 0.42; 0.56; 0.72; 0.88; 1"
                    dur="1.6s"
                    repeatCount="indefinite"
                    additive="sum"
                  />
                  <!-- Squash-stretch for wind warp feel -->
                  <animateTransform
                    attributeName="transform"
                    type="scale"
                    values="1 1; 1.06 0.96; 0.94 1.04; 1.07 0.95; 0.95 1.04; 1.03 0.98; 0.98 1.01; 1 1"
                    keyTimes="0; 0.14; 0.28; 0.44; 0.58; 0.72; 0.86; 1"
                    dur="1.6s"
                    repeatCount="indefinite"
                    additive="sum"
                  />
                  <g transform="translate(-256, -170)">
                    <!-- Heart (dark green base) -->
                    <path d="M256 298
                      C256 298 244 280 210 246
                      C170 206 136 168 136 122
                      C136 78 166 46 206 46
                      C234 46 250 62 256 74
                      C262 62 278 46 306 46
                      C346 46 376 78 376 122
                      C376 168 342 206 302 246
                      C268 280 256 298 256 298 Z"
                      fill="#2E7D32" />
                    <!-- Heart (light green inner) -->
                    <path d="M256 258
                      C256 258 248 246 226 224
                      C198 196 178 174 178 142
                      C178 112 196 90 222 90
                      C240 90 252 100 256 106
                      C260 100 272 90 290 90
                      C316 90 334 112 334 142
                      C334 174 314 196 286 224
                      C264 246 256 258 256 258 Z"
                      fill="#66BB6A" />
                    <!-- Tick / checkmark -->
                    <path d="M217 153 L243 189 L296 121"
                      stroke="white" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                  </g>
                </g>
              </g>

            </g>
          </g>
        </g>

      </g>
    </g>
  </g>
</svg>
